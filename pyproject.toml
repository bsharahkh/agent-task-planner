[project]
name = "task-agent"
version = "0.1.0"
description = "Recursive task planning agent with Neo4j-backed task storage."
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["task_agent*"]
